# Zenda's build for Work: tests the zenda patches and packs the portable zip as a workflow artifact.
# A tag `zenda-v<version>-z<n>` (for example zenda-v0.11.0-z1) also publishes the zip as a GitHub
# release of this public fork; Work's manifest downloads it from there, like upstream's releases.
name: Zenda

on:
  push:
    branches: ['zenda/**']
    tags: ['zenda-*']
  workflow_dispatch:
    inputs:
      z:
        description: "Zenda build number (the n in -z<n>)"
        type: string
        default: "1"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: craft-i18n at the pinned rev, with Zenda's rows
        shell: pwsh
        run: |
          $rev = (Get-Content craft-i18n.rev).Trim()
          git clone https://github.com/storytold/craft-i18n ..\craft-i18n
          git -C ..\craft-i18n checkout $rev
          pwsh zenda/i18n.ps1 -CraftI18n ..\craft-i18n
          "CRAFT_I18N_DIR=$((Resolve-Path ..\craft-i18n).Path)" >> $env:GITHUB_ENV
      - name: craft-fonts as of the v0.11.0 release (the official zip embeds them)
        shell: pwsh
        run: |
          git clone --filter=blob:none https://github.com/storytold/craft-fonts ..\craft-fonts
          git -C ..\craft-fonts checkout (Get-Content zenda/craft-fonts.rev).Trim()
          "CRAFT_FONTS_DIR=$((Resolve-Path ..\craft-fonts).Path)" >> $env:GITHUB_ENV
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Zenda patch tests (both builds)
        run: |
          cargo test -p wordcraft-ui-egui --lib zenda::
          cargo test -p wordcraft-ui-egui --lib --features zenda zenda::
      - name: Package
        shell: pwsh
        run: |
          $z = if ('${{ inputs.z }}') { '${{ inputs.z }}' }
               elseif ($env:GITHUB_REF_NAME -match '^zenda-v.+-z(\d+)$') { $Matches[1] }
               else { '1' }
          pwsh zenda/package.ps1 -Z $z
      - uses: actions/upload-artifact@v4
        with:
          name: wordcraft-zenda-portable
          path: dist/zenda/*.zip
      - name: Release (zenda-v* tags)
        if: startsWith(github.ref, 'refs/tags/zenda-v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $zip = Get-ChildItem dist/zenda/*.zip | Select-Object -First 1
          $sha = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          $notes = "Zenda's WordCraft build for Work. size: $($zip.Length) sha256: $sha"
          gh release create $env:GITHUB_REF_NAME $zip.FullName --title $env:GITHUB_REF_NAME --notes $notes
