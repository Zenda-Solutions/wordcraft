[package]
name = "zenda-theo"
description = "Theo's chat inside Zenda's builds of the tools: chat keys from Work, the dash chat proxy, the agent loop and the egui panel."
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[features]
default = []
# The side panel and Theo's cursor.
egui = ["dep:egui"]
# The real HTTP transport to the dash.
http = ["dep:ureq"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
# A range on purpose: WordCraft is on egui 0.36, the other forks on 0.37; each uses its own.
egui = { version = ">=0.36, <0.38", optional = true, default-features = false }
ureq = { version = "3", optional = true, features = ["json"] }

[dev-dependencies]
# The panel previews (`cargo test -p zenda-theo --features egui panel_preview -- --ignored`).
egui_kittest = { workspace = true, features = ["wgpu"] }
image = { workspace = true }
egui = { workspace = true, features = ["default_fonts"] }

[lints]
workspace = true
